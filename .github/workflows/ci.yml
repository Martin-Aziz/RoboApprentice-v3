name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─── Rust API ────────────────────────────────
  rust-check:
    name: Rust — Check, Lint, Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge_dev_password
          POSTGRES_DB: forge_mind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://forge:forge_dev_password@localhost:5432/forge_mind_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (zero warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Generate dev JWT keys
        run: |
          mkdir -p keys
          openssl genpkey -algorithm RSA -out keys/jwt_private.pem -pkeyopt rsa_keygen_bits:2048
          openssl rsa -pubout -in keys/jwt_private.pem -out keys/jwt_public.pem

      - name: Run tests
        env:
          JWT_PRIVATE_KEY_PATH: ./keys/jwt_private.pem
          JWT_PUBLIC_KEY_PATH: ./keys/jwt_public.pem
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: forge-mind-demos
          S3_ACCESS_KEY_ID: test
          S3_SECRET_ACCESS_KEY: test
          ML_SERVICE_URL: http://localhost:8001
        run: cargo test --all

      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  # ─── Python ML Service ───────────────────────
  python-check:
    name: Python — Lint, Type Check, Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/

      - name: Tests
        run: pytest tests/ -v --tb=short

  # ─── Frontend ────────────────────────────────
  frontend-check:
    name: Frontend — Lint, Type Check, Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint (zero warnings)
        run: pnpm lint --max-warnings=0

      - name: Tests
        run: pnpm test:unit

      - name: Build verification
        run: pnpm build

  # ─── Docker Build ────────────────────────────
  docker-build:
    name: Docker — Build Verification
    runs-on: ubuntu-latest
    needs: [rust-check, python-check, frontend-check]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f docker/api.Dockerfile -t forge-mind-api:test .

      - name: Build ML Service image
        run: docker build -f docker/ml-service.Dockerfile -t forge-mind-ml:test .

      - name: Build Web image
        run: docker build -f docker/web.Dockerfile -t forge-mind-web:test .
